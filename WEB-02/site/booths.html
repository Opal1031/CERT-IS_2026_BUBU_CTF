<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07131e" />
    <title>BUBU 행사 포털 | 부스 안내</title>
    <link rel="stylesheet" href="/static/style.css" />
    <script src="/static/booths.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="brand" href="/" aria-label="BUBU 행사 포털 홈">
          <span class="brand-mark">BB</span>
          <span><span class="brand-name">BUBU</span><span class="brand-caption">부산대 · 부경대 연합 행사 포털</span></span>
        </a>
        <nav class="site-nav" aria-label="주 메뉴">
          <a href="/">홈</a>
          <a href="/booths" aria-current="page">부스 안내</a>
          <a href="/schedule">일정</a>
          <a href="/guide">이용 안내</a>
        </nav>
      </header>

      <main>
        <section class="hero compact" aria-labelledby="page-title">
          <p class="eyebrow">BUBU CAMPUS CONNECT · BOOTHS</p>
          <h1 id="page-title">부스 안내</h1>
          <p class="lead">관심 있는 전시와 체험 부스를 찾아보세요. 목록은 선택한 기준에 따라 다시 표시됩니다.</p>
        </section>

        <section class="section" aria-labelledby="booth-list-title">
          <div class="toolbar">
            <div>
              <h2 id="booth-list-title">전체 부스</h2>
              <p>부스 번호와 위치를 확인해 주세요. 선택한 정렬 기준은 주소에 저장됩니다.</p>
            </div>
            <label class="sort-control" for="sort-select">정렬 기준
              <select id="sort-select" name="sort">
                <option value="popularity DESC, id ASC">인기순</option>
                <option value="name COLLATE NOCASE ASC">이름순</option>
                <option value="id ASC">부스 번호순</option>
              </select>
            </label>
          </div>
          <p class="status" id="booth-status" role="status" aria-live="polite">부스 정보를 불러오는 중입니다.</p>
          <div class="booth-grid" id="booth-list" aria-label="부스 목록"></div>
        </section>
      </main>

      <footer class="site-footer"><span>© 2026 BUBU Campus Connect</span><span>부산대 · 부경대 연합 행사 포털</span></footer>
    </div>
  </body>
</html>
